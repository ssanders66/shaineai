<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaine &mdash; Lighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============ TOKENS (shared with shaineai.com) ============ */
  :root{
    --bg: #0b1420;
    --bg-raised: #121d2d;
    --text: #f2f5f9;
    --text-dim: #93a4bb;
    --signal: #6fa4dd;
    --scope: #9fc0de;
    --border: rgba(242,245,249,0.14);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #eef2f7;
      --bg-raised: #e1e8f1;
      --text: #0f1b2c;
      --text-dim: #51617a;
      --signal: #2f5c94;
      --scope: #4a7ab0;
      --border: rgba(15,27,44,0.14);
    }
  }
  :root[data-theme="light"]{
    --bg: #eef2f7;
    --bg-raised: #e1e8f1;
    --text: #0f1b2c;
    --text-dim: #51617a;
    --signal: #2f5c94;
    --scope: #4a7ab0;
    --border: rgba(15,27,44,0.14);
  }
  :root[data-theme="dark"]{
    --bg: #0b1420;
    --bg-raised: #121d2d;
    --text: #f2f5f9;
    --text-dim: #93a4bb;
    --signal: #6fa4dd;
    --scope: #9fc0de;
    --border: rgba(242,245,249,0.14);
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--signal);
    outline-offset:3px;
  }

  /* ============ HEADER ============ */
  .bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:1rem clamp(1rem, 4vw, 2rem);
    flex:none;
  }
  .wordmark{
    font-family:"Big Shoulders Display", sans-serif;
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--text);
  }
  .eyebrow{
    font-size:0.68rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:0.55em;
  }
  .eyebrow::before{
    content:"";
    width:0.45em;
    height:0.45em;
    border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--signal) 25%, transparent);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  @media (prefers-reduced-motion: reduce){ .eyebrow::before{ animation:none; } }

  /* ============ ARTWORK STAGE ============ */
  .stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 1rem 0.5rem;
    min-height:0;
  }

  .art-wrap{
    position:relative;
    display:inline-block;
    line-height:0;
    max-height:calc(100vh - 9rem);
    max-width:min(430px, 92vw);
  }
  .art-wrap img{
    display:block;
    width:auto;
    height:auto;
    max-width:min(430px, 92vw);
    max-height:calc(100vh - 9rem);
    border-radius:10px;
    box-shadow:0 1.5rem 3rem var(--border);
  }

  .hotspot{
    position:absolute;
    border-radius:8px;
    border:1.5px solid transparent;
    background:transparent;
    transition:background 0.15s ease, border-color 0.15s ease;
    cursor:pointer;
  }
  .hotspot:hover, .hotspot:focus-visible{
    background:color-mix(in srgb, var(--signal) 22%, transparent);
    border-color:color-mix(in srgb, var(--signal) 70%, transparent);
    outline:none;
  }
  .hotspot:focus-visible{
    outline:2px solid var(--signal);
    outline-offset:2px;
  }

  .hs-spotify{ left:1.39%; top:74.48%; width:30.56%; height:6.98%; }
  .hs-apple{   left:35.19%; top:74.48%; width:31.02%; height:6.98%; }
  .hs-youtube{ left:70.37%; top:74.48%; width:28.70%; height:6.98%; }

  /* ============ FOOTER ============ */
  .foot{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.4rem;
    padding:0.9rem 1rem 1.3rem;
    text-align:center;
  }
  .foot .hint{
    font-size:0.66rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .foot .back{
    font-size:0.68rem;
    letter-spacing:0.06em;
    text-decoration:none;
    color:var(--text-dim);
    border-bottom:1px solid var(--border);
    padding-bottom:0.1em;
    transition:color 0.15s ease;
  }
  .foot .back:hover{ color:var(--signal); }
</style>
</head>
